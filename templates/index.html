<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STAR//FALL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="cabinet">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">+</span> STAR//FALL</div>
        <div class="status"><span class="pulse"></span> ARCADE ONLINE</div>
      </header>

      <section class="hud" aria-label="Game status">
        <div><span class="label">SCORE</span><strong id="score">000000</strong></div>
        <div><span class="label">WAVE</span><strong id="wave">01</strong></div>
        <div><span class="label">SHIELDS</span><strong id="lives">03</strong></div>
      </section>

      <section class="screen-wrap">
        <canvas id="game" width="900" height="620" aria-label="Starfall game canvas"></canvas>
        <div id="message" class="message">
          <p class="eyebrow">DEEP SPACE DEFENSE</p>
          <h1>STAR<span>//</span>FALL</h1>
          <p>Hold the line. Clear every wave.</p>
          <button id="start-button">START MISSION</button>
          <small>Arrow keys / A D to move &nbsp; | &nbsp; Space to fire</small>
        </div>
      </section>

      <footer class="controls">
        <span><kbd>A</kbd><kbd>D</kbd> MOVE</span>
        <span><kbd>SPACE</kbd> FIRE</span>
        <span><kbd>P</kbd> PAUSE</span>
      </footer>
    </main>
    <script src="{{ url_for('static', filename='game.js') }}"></script>
  </body>
</html>
